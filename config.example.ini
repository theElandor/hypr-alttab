# Copy to ~/.config/hypr-alttab/config.ini and restart the daemon
# (`hypr-alttab-ctl quit`; the next Alt+Tab starts it again).

[general]
# Which windows to list: all | monitor | workspace
scope = all
# Include windows on special workspaces (scratchpads)
include_special = true
# Key whose release confirms the selection: alt | super | ctrl
# (must match the modifier used in your Hyprland bind)
modifier = alt
# A quick tap shorter than this switches without showing the switcher
show_delay_ms = 120
# Refresh interval of the live previews while open (0 disables)
live_refresh_ms = 750
fade_ms = 110

[style]
thumbnail_height = 170
max_width_fraction = 0.9
font_size = 10
# Colors are #rrggbb or #rrggbbaa
panel_color = #202020d9
panel_border_color = #ffffff1f
tile_hover_color = #ffffff14
tile_selected_color = #ffffff1f
selection_border_color = #ffffffff
text_color = #ffffffff
corner_radius = 12
