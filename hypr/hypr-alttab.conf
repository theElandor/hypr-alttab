# hypr-alttab: Windows-style Alt+Tab for Hyprland.
# Source this from hyprland.conf (adjust paths if you didn't `make install`):
#   source = ~/.config/hypr/hypr-alttab.conf

$alttab = ~/.local/bin/hypr-alttab-ctl

exec-once = ~/.local/bin/hypr-alttab

unbind = ALT, Tab
unbind = ALT SHIFT, Tab
bind = ALT, Tab, exec, $alttab next
bind = ALT SHIFT, Tab, exec, $alttab prev

# Acrylic look: blur behind the panel, no compositor open/close animation
# (the switcher does its own fade).
layerrule = match:namespace hypr-alttab, blur on
layerrule = match:namespace hypr-alttab, ignore_alpha 0.3
layerrule = match:namespace hypr-alttab, no_anim on
